<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data: https:;">
    <title>Acode Pro Repo Extractor (Safe Mode)</title>
    <style>
        /* --- CSS VARIABLES DENGAN DUAL THEME --- */
        :root, html[data-theme="light"] {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --bg-input-focus: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --editor-bg: #0d1117;
            --editor-header-bg: #161b22;
            --editor-border: #30363d;
            --editor-text: #c9d1d9;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --decor-gradient: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
            --btn-secondary-bg: #f1f5f9;
            --btn-secondary-text: #334155;
            --btn-secondary-hover: #e2e8f0;
            --history-item-bg: #f8fafc;
            --modal-bg: #ffffff;
        }

        html[data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #1e1b4b;
            --bg-body: #090d16;
            --bg-card: #111827;
            --bg-input: #1a2234;
            --bg-input-focus: #1f293d;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1f293d;
            --editor-bg: #0b0f19;
            --editor-header-bg: #131b2e;
            --editor-border: #232f48;
            --editor-text: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --decor-gradient: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            --btn-secondary-bg: #1e293b;
            --btn-secondary-text: #e2e8f0;
            --btn-secondary-hover: #334155;
            --history-item-bg: #162032;
            --modal-bg: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .bg-decor {
            position: fixed; top: 0; left: 0; width: 100%; height: 300px;
            background: var(--decor-gradient);
            z-index: -1;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Top Bar & Theme Toggle */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .theme-toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
            outline: none;
        }
        .theme-toggle-btn:hover {
            border-color: var(--primary);
        }

        .header { text-align: center; margin-bottom: 5px; }
        .header h1 { font-size: 2.2rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
        .header h1 span { color: var(--primary); }
        .header p { color: var(--text-muted); font-size: 0.95rem; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .input-group { display: flex; flex-direction: column; gap: 12px; }
        
        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }
        
        .input-icon-left {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); width: 20px; height: 20px;
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 85px 16px 44px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            background: var(--bg-input);
            color: var(--text-main);
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            background: var(--bg-input-focus);
        }

        .paste-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--btn-secondary-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }
        .paste-btn:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn {
            display: inline-flex; justify-content: center; align-items: center; gap: 8px;
            background: var(--primary); color: #fff;
            border: none; border-radius: var(--radius-md);
            padding: 16px 24px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .btn-secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-text); }
        .btn-secondary:hover { background: var(--btn-secondary-hover); }

        .progress-area { display: none; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .progress-title { font-weight: 600; font-size: 1.1rem; color: var(--text-main); }
        .progress-sub { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
        .progress-track { background: var(--border); height: 12px; border-radius: 10px; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #3b82f6, #6366f1); height: 100%; width: 0%; transition: width 0.3s ease; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .editor-card { display: none; padding: 0; overflow: hidden; background: var(--editor-bg); position: relative; border-color: var(--editor-border); }
        .editor-header {
            display: flex; flex-direction: column; gap: 12px;
            padding: 16px 20px; background: var(--editor-header-bg); border-bottom: 1px solid var(--editor-border);
        }
        .editor-title { color: #fff; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .editor-actions { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
        .editor-actions .btn { flex: 1 1 150px; padding: 12px; font-size: 0.9rem; }

        /* AREA TEKS NATIVE PRE */
        .content-container {
            position: relative;
            width: 100%;
            height: 65vh;
            display: flex;
        }
        
        .code-scroll-area {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            overflow-x: auto;
            padding: 20px 40px 20px 20px; 
            -webkit-overflow-scrolling: touch;
            scroll-behavior: auto;
            scrollbar-width: none;
        }
        .code-scroll-area::-webkit-scrollbar { display: none; }

        pre {
            margin
