<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Repo2Text Ultra — Repo & ZIP Extractor</title>
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --bg-body: #f8fafc; --bg-card: #fff;
            --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --editor-bg: #0d1117;
            --editor-text: #c9d1d9; --radius-lg: 16px; --radius-md: 12px;
            --shadow: 0 10px 25px -5px rgba(0,0,0,.05), 0 8px 10px -6px rgba(0,0,0,.01);
            --lh: 21px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); line-height: 1.5; padding: 20px; overflow-x: hidden; }
        .bg-decor { position: fixed; top: 0; left: 0; width: 100%; height: 300px; background: linear-gradient(135deg, #e0e7ff, #ede9fe); z-index: -1; border-radius: 0 0 40px 40px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { font-size: 2.2rem; font-weight: 800; color: #1e293b; }
        .header h1 span { color: var(--primary); }
        .card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .tab-group { display: flex; gap: 8px; background: #f1f5f9; padding: 6px; border-radius: var(--radius-md); margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px 16px; border: 0; background: transparent; font-weight: 600; font-size: .95rem; color: var(--text-muted); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .2s; -webkit-tap-highlight-color: transparent; }
        .tab-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 4px rgba(0,0,0,.06); }
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        .input-wrapper { position: relative; flex: 1; }
        .input-wrapper svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; width: 20px; height: 20px; }
        input[type="text"] { width: 100%; padding: 16px 16px 16px 44px; font-size: 1rem; border: 2px solid var(--border); border-radius: var(--radius-md); outline: 0; background: #f8fafc; }
        input[type="text"]:focus { border-color: var(--primary); background: #fff; }
        .drop-zone { border: 2px dashed var(--border); border-radius: var(--radius-md); padding: 30px 20px; text-align: center; background: #f8fafc; cursor: pointer; transition: all .2s; display: flex; flex-direction: column; align-items: center; gap: 10px; -webkit-tap-highlight-color: transparent; }
        .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background: #eef2ff; }
        .drop-zone svg { color: var(--primary); }
        .drop-zone-text { font-size: 1rem; font-weight: 600; color: #334155; }
        .drop-zone-sub { font-size: .85rem; color: var(--text-muted); }
        .btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; background: var(--primary); color: #fff; border: 0; border-radius: var(--radius-md); padding: 16px 24px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s, transform .1s; -webkit-tap-highlight-color: transparent; }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(.98); }
        .btn:disabled { opacity: .7; cursor: not-allowed; }
        .btn-secondary { background: #f1f5f9; color: #334155; }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .progress-area { display: none; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
        .progress-title { font-weight: 600; font-size: 1.1rem; }
        .progress-sub { color: var(--text-muted); font-size: .9rem; margin-top: 4px; word-break: break-all; }
        .progress-track { background: #e2e8f0; height: 12px; border-radius: 10px; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #3b82f6, #6366f1); height: 100%; width: 0%; transition: width .2s; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .progress-stats { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: .85rem; color: var(--text-muted); }
        .editor-card { display: none; padding: 0; overflow: hidden; background: var(--editor-bg); }
        .editor-header { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; background: #161b22; border-bottom: 1px solid #30363d; }
        .editor-title { color: #fff; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .editor-actions { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
        .editor-actions .btn { flex: 1 1 150px; padding: 12px; font-size: .9rem; }
        .content-container { position: relative; width: 100%; height: 65vh; display: flex; }
        .code-scroll-area { flex: 1; height: 100%; overflow: auto; background: var(--editor-bg); position: relative; -webkit-overflow-scrolling: touch; scrollbar-width: none; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: var(--lh); }
        .code-scroll-area::-webkit-scrollbar { display: none; }
        .virtual-spacer { position: relative; width: 100%; }
        .virtual-content { position: absolute; top: 0; left: 0; right: 0; will-change: transform; }
        .code-line { display: flex; min-height: var(--lh); padding-right: 20px; }
        .line-num { display: inline-block; width: 56px; flex-shrink: 0; text-align: right; padding-right: 14px; color: #484f58; user-select: none; border-right: 1px solid #21262d; margin-right: 14px; font-size: 12px; line-height: var(--lh); }
        .line-text { white-space: pre; color: var(--editor-text); font-size: 13px; line-height: var(--lh); user-select: text; }
        .custom-scrollbar-track { position: absolute; top: 10px; bottom: 10px; right: 6px; width: 24px; background: rgba(48,54,61,.3); border-radius: 12px; z-index: 10; }
        .custom-scrollbar-thumb { position: absolute; top: 0; left: 2px; width: 20px; height: 60px; background: rgba(139,148,158,.6); border-radius: 10px; cursor: pointer; touch-action: none; transition: background .2s; }
        .custom-scrollbar-thumb:active, .custom-scrollbar-thumb.dragging { background: var(--primary); }
        .custom-scrollbar-thumb::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 10px; height: 2px; background: rgba(255,255,255,.8); box-shadow: 0 -4px 0 rgba(255,255,255,.8), 0 4px 0 rgba(255,255,255,.8); }
        .editor-footer { display: flex; justify-content: space-between; padding: 12px 20px; background: #161b22; border-top: 1px solid #30363d; color: #8b949e; font-size: .85rem; font-family: monospace; }
        .flex-center { display: flex; align-items: center; gap: 6px; }
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #334155; color: #fff; padding: 12px 24px; border-radius: 50px; font-size: .9rem; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: bottom .4s cubic-bezier(.175,.885,.32,1.275); z-index: 1000; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toast.show { bottom: 30px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.7); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity .3s; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box { background: #fff; border-radius: 20px; width: 90%; max-width: 400px; padding: 24px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); transform: scale(.9); transition: transform .3s cubic-bezier(.175,.885,.32,1.275); }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-icon { width: 60px; height: 60px; background: #fee2e2; color: #ef4444; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 16px; }
        .modal-title { font-size: 1.25rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
        .modal-text { color: #64748b; font-size: .95rem; line-height: 1.5; margin-bottom: 24px; word-break: break-word; }
        .modal-btn { background: var(--primary); color: #fff; width: 100%; padding: 12px; border-radius: 12px; border: 0; font-weight: 600; font-size: 1rem; cursor: pointer; }
        .modal-btn:active { transform: scale(.98); }
        .modal-btn-danger { background: #ef4444; margin-top: 8px; }
        .modal-btn-secondary { background: #e2e8f0; color: #334155; margin-top: 8px; }
        .history-card { margin-top: 10px; display: none; }
        .history-card.show { display: block; }
        .history-header { font-weight: 600; margin-bottom: 12px; font-size: 1.1rem; color: #1e293b; }
        .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e8f0; transition: all .2s; }
        .history-item:hover { border-color: var(--primary); box-shadow: 0 2px 4px rgba(0,0,0,.05); }
        .history-link { font-size: .9rem; word-break: break-all; cursor: pointer; color: var(--primary); flex: 1; margin-right: 10px; text-decoration: none; }
        .history-link:hover { text-decoration: underline; }
        .history-actions { display: flex; gap: 8px; }
        .icon-btn { background: transparent; border: 0; cursor: pointer; color: #64748b; padding: 4px; display: flex; align-items: center; justify-content: center; border-radius: 4px; transition: all .2s; }
        .icon-btn:hover { color: var(--primary); background: #e0e7ff; }
        .icon-btn.delete:hover { color: #ef4444; background: #fee2e2; }
        @media (min-width: 640px) {
            .input-group { flex-direction: row; }
            .editor-header { flex-direction: row; justify-content: space-between; }
            .editor-actions { width: auto; }
        }
    </style>
</head>
<body>
    <div class="bg-decor"></div>
    <div class="container">
        <div class="header"><h1>Repo & ZIP <span>Extractor</span></h1></div>

        <div class="card">
            <div class="tab-group">
                <button class="tab-btn active" id="tabUrl" onclick="switchMode('url')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    URL Repositori
                </button>
                <button class="tab-btn" id="tabZip" onclick="switchMode('zip')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                    Upload File ZIP
                </button>
            </div>

            <div id="urlSection" class="input-group">
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill
