<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acode Pro Repo Extractor (Safe Mode)</title>
    <style>
        /* --- CSS NATIVE UNIVERSAL --- */
        :root {
            /* Monokrom Mewah Palette */
            --primary: #36363c; /* Deep Charcoal Blue-Gray (subtle accent) */
            --primary-hover: #2a2a30; /* Darker primary for hover */
            --bg-body: #121212; /* Very dark gray, almost black */
            --bg-card: #1a1a1a; /* Slightly lighter dark gray for cards */
            --text-main: #e0e0e0; /* Light gray for main text */
            --text-muted: #a0a0a0; /* Medium gray for muted text */
            --border: #333333; /* Dark gray for borders */
            --editor-bg: #161616; /* Almost black for code editor background */
            --editor-text: #e0e0e0; /* Light gray for editor text */
            --radius-lg: 16px;
            --radius-md: 12px;
            /* Adjusted shadow for dark backgrounds for a richer, luxurious feel */
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
            overflow-x: hidden;
        }

        .bg-decor {
            position: fixed; top: 0; left: 0; width: 100%; height: 300px;
            /* Subtle dark gradient for luxury feel */
            background: linear-gradient(135deg, #181818 0%, #0d0d0d 100%);
            z-index: -1;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header { text-align: center; margin-bottom: 10px; }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main); /* Align with new main text color */
            margin-bottom: 8px;
        }
        .header h1 span {
            color: white; /* Stronger accent for "Pro" in a dark theme */
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .input-group { display: flex; flex-direction: column; gap: 12px; }
        .input-wrapper { position: relative; flex: 1; }
        .input-wrapper svg {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); /* Use muted text color for icons */
            width: 20px; height: 20px;
        }

        input[type="text"] {
            width: 100%; padding: 16px 16px 16px 44px; font-size: 1rem;
            border: 2px solid var(--border); border-radius: var(--radius-md);
            outline: none; transition: border-color 0.2s;
            background: var(--bg-card); /* Consistent input background with cards */
            color: var(--text-main); /* Ensure input text is visible on dark background */
        }
        input[type="text"]:focus {
            border-color: var(--text-main); /* Brighter border on focus for clear indication */
            background: var(--bg-card); /* Keep background consistent */
        }
        /* Placeholder styling for dark theme for better visibility */
        input[type="text"]::placeholder {
            color: var(--text-muted);
            opacity: 0.7; /* Slightly transparent */
        }

        .btn {
            display: inline-flex; justify-content: center; align-items: center; gap: 8px;
            background: var(--primary); /* Use new primary accent color */
            color: white; /* High contrast white text for primary buttons */
            border: none; border-radius: var(--radius-md);
            padding: 16px 24px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .btn-secondary {
            background: var(--border); /* Use border color for secondary button background */
            color: var(--text-main); /* Light text on secondary button */
        }
        .btn-secondary:hover { background: var(--text-muted); } /* Darker gray on hover for secondary */

        .progress-area { display: none; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .progress-title { font-weight: 600; font-size: 1.1rem; }
        .progress-sub { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
        .progress-track { background: var(--border); height: 12px; border-radius: 10px; overflow: hidden; } /* Use border color for track */
        .progress-bar {
            /* Monochrome gradient for progress bar to fit the theme */
            background: linear-gradient(90deg, #777777, #eeeeee);
            height: 100%; width: 0%; transition: width 0.3s ease;
        }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .editor-card { display: none; padding: 0; overflow: hidden; background: var(--editor-bg); position: relative; }
        .editor-header {
            display: flex; flex-direction: column; gap: 12px;
            padding: 16px 20px;
            background: var(--editor-bg); /* Use editor background for consistency */
            border-bottom: 1px solid var(--border); /* Use border color for separation */
        }
    </style>
</head>
<body>
    <div class="bg-decor"></div>
    <div class="container">
        <header class="header">
            <h1>Acode <span>Pro</span> Repo Extractor</h1>
            <p class="progress-sub">Extract a GitHub repository directly to your Acode project. (Safe Mode: Read-only access)</p>
        </header>

        <div class="card">
            <div class="input-group">
                <div class="input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 21h7.5A2.25 2.25 0 0020.25 18V9.75M10.5 21h-4.224a2.25 2.25 0 01-2.249-2.5l1.092-7.649m4.162 10.149V6a1.125 1.125 0 011.125-1.125h2.25M10.5 21an2.25 2.25 0 002.25-2.25V6a1.125 1.125 0 011.125-1.125h2.25M15 12a1.125 1.125 0 00-1.125-1.125H12a1.125 1.125 0 00-1.125 1.125V15a1.125 1.125 0 001.125 1.125h1.875a1.125 1.125 0 001.125-1.125V12z"></path></svg>
                    <input type="text" id="repoUrl" placeholder="Enter GitHub repository URL (e.g., github.com/user/repo)">
                </div>
                <button class="btn" id="extractBtn">
                    <svg class="spinner hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true" style="width: 20px; height: 20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12a7.5 7.5 0 0115 0v2.25c0 1.385-.353 2.709-1 3.905l-5.405-5.405c-.328-.328-.75-.52-1.2-.52h-.59c-.45 0-.872.192-1.2.52L6.105 18.155A7.465 7.465 0 014.5 12z"></path></svg>
                    <span>Extract Repository</span>
                </button>
            </div>
        </div>

        <div class="card progress-area" id="progressArea">
            <div class="progress-header">
                <div class="progress-info">
                    <div class="progress-title">Processing...</div>
                    <div class="progress-sub" id="progressStatus">Starting extraction...</div>
                </div>
                <div class="progress-percentage" id="progressPercentage">0%</div>
            </div>
            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div class="card editor-card" id="editorCard">
            <div class="editor-header">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div style="font-size: 1.1rem; font-weight: 600;" id="editorTitle">Output</div>
                    <button class="btn-secondary" id="saveBtn" style="padding: 10px 16px; font-size: 0.9rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 18px; height: 18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                        Save as project
                    </button>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);" id="filePath"></div>
            </div>
            <pre id="editor" style="width: 100%; height: 400px; padding: 20px; font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; overflow: auto; color: var(--editor-text);"></pre>
        </div>

    </div>

    <script>
        const repoUrlInput = document.getElementById('repoUrl');
        const extractBtn = document.getElementById('extractBtn');
        const spinner = extractBtn.querySelector('.spinner');
        const progressArea = document.getElementById('progressArea');
        const progressStatus = document.getElementById('progressStatus');
        const progressBar = document.getElementById('progressBar');
        const progressPercentage = document.getElementById('progressPercentage');
        const editorCard = document.getElementById('editorCard');
        const editorTitle = document.getElementById('editorTitle');
        const filePath = document.getElementById('filePath');
        const editor = document.getElementById('editor');
        const saveBtn = document.getElementById('saveBtn');

        let currentFileContent = '';
        let currentFileName = '';
        let currentRepoName = '';

        extractBtn.addEventListener('click', async () => {
            const url = repoUrlInput.value.trim();
            if (!url) {
                alert('Please enter a GitHub repository URL.');
                return;
            }

            // Basic validation for GitHub URL
            const githubUrlRegex = /^(https?:\/\/)?(www\.)?github\.com\/[a-zA-Z0-9_-]+\/[a-zA-Z0-9_-]+(\/.*)?$/;
            if (!githubUrlRegex.test(url)) {
                alert('Please enter a valid GitHub repository URL.');
                return;
            }

            // Extract repo details (user/repo)
            const pathParts = new URL(url.includes('://') ? url : `https://${url}`).pathname.split('/').filter(p => p);
            if (pathParts.length < 2) {
                alert('Invalid GitHub repository URL format. Expected: github.com/user/repo');
                return;
            }
            const owner = pathParts[0];
            const repo = pathParts[1];
            currentRepoName = repo;

            // Reset UI
            editorCard.style.display = 'none';
            editor.textContent = '';
            filePath.textContent = '';
            progressArea.style.display = 'flex';
            progressBar.style.width = '0%';
            progressPercentage.textContent = '0%';
            progressStatus.textContent = 'Initializing extraction...';
            extractBtn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                // Mock API call to GitHub (replace with actual backend/proxy in Acode environment)
                const mockApiUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`;
                
                // Simulate fetch progress
                let progress = 0;
                const totalSteps = 100; // Arbitrary total steps for simulation
                const increment = 100 / totalSteps;

                const updateProgress = (status, currentProgress) => {
                    progress = Math.min(100, currentProgress);
                    progressStatus.textContent = status;
                    progressBar.style.width = `${progress}%`;
                    progressPercentage.textContent = `${Math.round(progress)}%`;
                };

                updateProgress('Fetching repository tree...', 10);

                const response = await fetch(mockApiUrl, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json'
                        // Add Authorization header if using a token:
                        // 'Authorization': `token YOUR_GITHUB_TOKEN`
                    }
                });

                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                const files = data.tree.filter(item => item.type === 'blob');

                if (files.length === 0) {
                    throw new Error('No files found in the repository.');
                }

                updateProgress(`Found ${files.length} files. Downloading first file...`, 30);

                // For safe mode, we'll only display the first file for demonstration.
                // In a real Acode integration, you'd iterate and save all files.
                const firstFile = files[0];
                const fileContentResponse = await fetch(firstFile.url, {
                    headers: {
                        'Accept': 'application/vnd.github.v3.raw'
                    }
                });

                if (!fileContentResponse.ok) {
                    throw new Error(`Failed to fetch file content: ${firstFile.path}`);
                }

                currentFileContent = await fileContentResponse.text();
                currentFileName = firstFile.path;

                updateProgress(`Displaying ${currentFileName}...`, 100);

                setTimeout(() => { // Simulate UI update delay
                    progressArea.style.display = 'none';
                    editorCard.style.display = 'block';
                    editorTitle.textContent = currentFileName;
                    filePath.textContent = `${owner}/${repo}/${currentFileName}`;
                    editor.textContent = currentFileContent;
                    extractBtn.disabled = false;
                    spinner.classList.add('hidden');
                }, 500);

            } catch (error) {
                console.error('Extraction error:', error);
                progressStatus.textContent = `Error: ${error.message}`;
                progressBar.style.width = '0%';
                progressPercentage.textContent = 'Error';
                extractBtn.disabled = false;
                spinner.classList.add('hidden');
                alert(`Error during extraction: ${error.message}`);
            }
        });

        saveBtn.addEventListener('click', () => {
            if (currentFileContent && currentFileName && currentRepoName) {
                // In a real Acode environment, this would call Acode API to save project
                alert(`Simulating "Save as project" for:\nRepo: ${currentRepoName}\nFile: ${currentFileName}\nContent length: ${currentFileContent.length}`);
                // Example of how Acode API might be used (concept only):
                // acode.fs(acode.app.getPath('home')).createDirectory(currentRepoName)
                //   .then(dir => dir.createFile(currentFileName, currentFileContent));
            } else {
                alert('No content to save.');
            }
        });
    </script>
</body>
</html>
